
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ليل البنفسج | الجزء الثاني</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#100b19;color:#fff;font-family:Arial;text-align:center}
header{background:#251438;padding:28px 15px;border-bottom:1px solid #68418a}
h1{color:#d5a5ff;margin:0 0 10px}
.box{background:#241b30;padding:22px;margin:22px auto;border-radius:16px;max-width:600px;width:92%}
input,button{padding:13px;margin:8px;border-radius:9px;max-width:95%;font-size:15px}
input{background:#fff;color:#222;border:0}
button{background:#9b59b6;color:white;border:0;cursor:pointer}
button:disabled{opacity:.5}
video{width:100%;margin-top:12px;border-radius:12px;background:#000}
.episode{background:#352544;padding:15px;margin:15px 0;border-radius:12px}
#status,#message{overflow-wrap:anywhere;color:#e4c7ff}
</style>
</head>
<body>

<header>
<h1>ليل البنفسج</h1>
<p>الجزء الثاني</p>
</header>

<div class="box" id="login">
<h2>تسجيل الدخول</h2>
<input id="email" type="email" placeholder="البريد الإلكتروني">
<br>
<input id="password" type="password" placeholder="كلمة المرور">
<br>
<button id="loginBtn" onclick="login()">دخول</button>
<p id="status">أدخل بيانات حسابك</p>
</div>

<div class="box" id="library" hidden>
<h2>مكتبة الحلقات</h2>
<input type="file" id="file" accept="video/mp4">
<br>
<button id="uploadBtn" onclick="upload()">رفع الحلقة</button>
<button onclick="loadEpisodes()">تحديث المكتبة</button>
<button onclick="logout()">تسجيل الخروج</button>
<p id="message"></p>
<div id="episodes"></div>
</div>

<script>
const SUPABASE_URL = "https://njszmowbcsizrcalbnsv.supabase.co";
const SUPABASE_KEY = "ضع مفتاحك publishable هنا";
const BUCKET = "Lail purple";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

async function refresh(){
  const {data,error}=await db.auth.getSession();

  if(error){
    document.getElementById('status').textContent=error.message;
    return;
  }

  const session=data.session;
  document.getElementById('login').hidden=!!session;
  document.getElementById('library').hidden=!session;

  if(session) await loadEpisodes();
}

async function login(){
  const status=document.getElementById('status');
  const button=document.getElementById('loginBtn');

  const email=document.getElementById('email').value.trim();
  const password=document.getElementById('password').value;

  if(!email||!password){
    status.textContent='أدخل البريد وكلمة المرور';
    return;
  }

  button.disabled=true;
  status.textContent='جاري تسجيل الدخول...';

  try{
    const {error}=await db.auth.signInWithPassword({email,password});

    if(error){
      status.textContent=error.message;
      return;
    }

    status.textContent='تم تسجيل الدخول';
    await refresh();

  }catch(e){
    status.textContent='خطأ: '+e.message;
  }finally{
    button.disabled=false;
  }
}

async function upload(){
  const message=document.getElementById('message');
  const button=document.getElementById('uploadBtn');
  const file=document.getElementById('file').files[0];

  if(!file){
    message.textContent='اختر الحلقة أولاً';
    return;
  }

  if(file.type!=='video/mp4'){
    message.textContent='الملف يجب أن يكون MP4';
    return;
  }

  const {data:{user},error:userError}=await db.auth.getUser();

  if(userError||!user){
    message.textContent='سجّل الدخول أولاً';
    return;
  }

  const path=user.id+'/'+Date.now()+'.mp4';

  button.disabled=true;
  message.textContent='جاري رفع الحلقة...';

  try{
    const {error}=await db.storage.from(BUCKET).upload(path,file);

    if(error){
      message.textContent='فشل الرفع: '+error.message;
      return;
    }

    message.textContent='تم رفع الحلقة بنجاح';
    document.getElementById('file').value='';
    await loadEpisodes();

  }catch(e){
    message.textContent='خطأ: '+e.message;
  }finally{
    button.disabled=false;
  }
}

async function loadEpisodes(){
  const area=document.getElementById('episodes');
  area.innerHTML='جاري تحميل الحلقات...';

  const {data:{user},error:userError}=await db.auth.getUser();

  if(userError||!user){
    area.textContent='تعذّر التحقق من الحساب';
    return;
  }

  const {data,error}=await db.storage.from(BUCKET).list(user.id);

  if(error){
    area.textContent='خطأ المكتبة: '+error.message;
    return;
  }

  area.innerHTML='';

  const videos=(data||[]).filter(item=>
    item.name && item.name.toLowerCase().endsWith('.mp4')
  );

  if(videos.length===0){
    area.textContent='لا توجد حلقات مرفوعة بعد';
    return;
  }

  for(const item of videos){
    const path=user.id+'/'+item.name;

    const {data:link,error:linkError}=await db.storage
      .from(BUCKET)
      .createSignedUrl(path,3600);

    if(linkError){
      area.textContent='تعذّر تشغيل '+item.name+': '+linkError.message;
      continue;
    }

    const box=document.createElement('div');
    box.className='episode';

    const title=document.createElement('h3');
    title.textContent=item.name;

    const video=document.createElement('video');
    video.controls=true;
    video.playsInline=true;
    video.preload='metadata';
    video.src=link.signedUrl;

    box.append(title,video);
    area.append(box);
  }
}

async function logout(){
  const {error}=await db.auth.signOut();

  if(error){
    document.getElementById('message').textContent=error.message;
    return;
  }

  await refresh();
}

refresh();
</script>
</body>
</html>
